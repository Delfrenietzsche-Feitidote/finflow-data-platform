services:
  postgres:
    image: postgres:16
    container_name: finflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: finflow-data
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: