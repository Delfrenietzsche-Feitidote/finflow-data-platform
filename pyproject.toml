[project]
name = "finflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-bigquery>=1.12.0",
    "google-cloud-bigquery>=3.44.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
finflow = "finflow:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"src/finflow/analytics/daily_metrics.py" = ["E501"]
"src/finflow/analytics/transactions.py" = ["E501"]
"src/finflow/transformation/transactions.py" = ["E501"]
