name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow
          POSTGRES_DB: finflow-data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow-data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: finflow-data
      DB_USER: finflow
      DB_PASSWORD: finflow
      DB_SCHEMA: warehouse
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if pg_isready \
              -h "$DATABASE_HOST" \
              -p "$DATABASE_PORT" \
              -U "$DATABASE_USER" \
              -d "$DATABASE_NAME"; then
              echo "PostgreSQL is ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 1
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Initialize database schema
        shell: bash
        run: |
          set -e

          export PGPASSWORD="$DATABASE_PASSWORD"

          echo "Creating schemas..."
          psql \
            -h "$DATABASE_HOST" \
            -p "$DATABASE_PORT" \
            -U "$DATABASE_USER" \
            -d "$DATABASE_NAME" \
            -f warehouse/ddl/schemas/create_schemas.sql

          echo "Creating dimensions..."
          for file in warehouse/ddl/dimensions/*.sql; do
            echo "Running $file"
            psql \
              -h "$DATABASE_HOST" \
              -p "$DATABASE_PORT" \
              -U "$DATABASE_USER" \
              -d "$DATABASE_NAME" \
              -f "$file"
          done

          echo "Creating facts..."
          for file in warehouse/ddl/facts/*.sql; do
            echo "Running $file"
            psql \
              -h "$DATABASE_HOST" \
              -p "$DATABASE_PORT" \
              -U "$DATABASE_USER" \
              -d "$DATABASE_NAME" \
              -f "$file"
          done

      - name: Run tests
        run: uv run pytest -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/airflow/Dockerfile
          push: false
          tags: finflow-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
