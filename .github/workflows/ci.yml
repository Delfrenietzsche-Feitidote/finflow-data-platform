name: FinFlow CI

on:
  push:
    branches:
      - main
      - feature/data-modeling
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finflow-data
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finflow -d finflow-data"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PYTHONPATH: src

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: finflow-data
      DB_USER: finflow
      DB_PASSWORD: finflow
      DB_SCHEMA: warehouse

      PIPELINE_BATCH_DATE: "2026-08-25"
      PIPELINE_BATCH_SIZE: "10000"
      PIPELINE_MAX_RETRIES: "3"
      PIPELINE_RETRY_DELAY: "30"
      PIPELINE_SOURCE_SYSTEM: financial_transactions

      STORAGE_BUCKET_NAME: finflow-data
      STORAGE_RAW_PATH: raw/
      STORAGE_STAGING_PATH: staging/
      STORAGE_REJECTED_PATH: rejected/

      LOG_LEVEL: INFO
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database schema
        run: |
          python -c "from finflow.database.schema import initialize_schema; initialize_schema()"

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Airflow image
        run: |
          docker build \
            -f docker/airflow/Dockerfile \
            -t finflow-airflow:ci .